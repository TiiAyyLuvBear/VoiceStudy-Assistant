# Default configuration for VoiceStudy-Assistant.
# Cấu hình dùng chung cho VoiceStudy Assistant.
# Mọi đường dẫn tương đối được tính từ thư mục chứa file config.yaml.
app:
  name: VoiceStudy Assistant
  environment: development

backend:
  host: 127.0.0.1
  port: 8000
  base_url: http://127.0.0.1:8000
  reload: false
  preload_models: true
  strict_model_startup: true
  request_timeout_seconds: 300
  max_upload_bytes: 26214400

paths:
  raw_data: data/raw
  processed_data: data/processed
  metadata: data/metadata
  command_audio: data/commands/audio
  command_audio_manifest: data/commands/command_audio_manifest.csv
  asr_validation: data/metadata/asr_validation.csv
  asr_test: data/metadata/asr_test.csv
  asr_reports: reports/asr
  database: data/database/voicestudy.db
  model_cache: models/cache
  speaker_model: reports/results/ecapa_voxvietnam_best.pt
  user_embeddings: models/user_embeddings
  identification_threshold: reports/results/evaluation/finetuned/open_set_metrics.json
  verification_threshold: reports/results/evaluation/finetuned/verification_metrics.json

audio:
  sample_rate: 16000
  channels: 1
  format: wav

# Theo yêu cầu tuần 1: Whisper Small chạy trên CPU.
# int8 giảm bộ nhớ và tăng tốc inference CPU.
asr:
  backend: faster-whisper
  model_size: small
  model_name: whisper-small-lora-wide-v4
  model_path: models/experimental/asr/v4/ctranslate2
  language: vi
  task: transcribe
  device: cpu
  compute_type: int8
  cpu_threads: 0
  num_workers: 1
  beam_size: 10
  vad_filter: true
  condition_on_previous_text: false
  word_timestamps: false
  download_root: models/cache/whisper
  local_files_only: true

speaker:
  backend: speechbrain
  embedding_model: speechbrain/spkrec-ecapa-voxceleb
  model_version: ecapa-voxvietnam-epoch-9
  checkpoint_path: reports/results/ecapa_voxvietnam_best.pt
  checkpoint_encoder_key: encoder
  checkpoint_sha256: 7265DAE5CD8EC650E405185888134286687641E77566F5206B0D401545A117CE
  checkpoint_strict: true
  pretrained_objective: additive_margin_softmax
  sample_rate: 16000
  embedding_dimension: 192
  device: cpu
  cache_dir: models/cache/ecapa
  evaluation_mode: true
  freeze_parameters: true
  fine_tune: false
  l2_normalize: true
  svm_centroid_dir:
  experimental_unknown_threshold_path: reports/results/evaluation/finetuned/open_set_metrics.json
  experimental_verification_threshold_path: reports/results/evaluation/finetuned/verification_metrics.json
  application_centroid_dir: models/application/user_embeddings
  application_sid_threshold_path: reports/results/evaluation/finetuned/open_set_metrics.json
  application_verification_threshold_path: reports/results/evaluation/finetuned/verification_metrics.json
  enrollment_audio_count: 5
  quality_gate:
    trial_scores_path: reports/results/evaluation/finetuned/verification_trial_scores.csv
    metrics_path: reports/results/evaluation/finetuned/verification_metrics.json
    smoke_audio_path: data/datasets/kaggle/VoxVietnam for Speaker Verification/voxvietnam_ecapa_three_task_v1/test/audio/voxvi_spk_0281/voxvi_03fa57cb2fc443efebbd.wav
    expected_trials: 3000
    expected_genuine_trials: 500
    expected_impostor_trials: 2500
    expected_eer: 0.15
    expected_min_dcf: 0.5196
    expected_far: 0.0028
    expected_frr: 0.364
    maximum_eer: 0.16
    maximum_far: 0.01
    maximum_frr: 0.38
    metric_tolerance: 0.0000001
    curve_tolerance: 0.0000001

database:
  path: data/database/voicestudy.db

logging:
  requests:
    enabled: true
    level: INFO
    console: true
    file_path: logs/requests.log
    max_bytes: 5242880
    backup_count: 3
    include_transcript: false
